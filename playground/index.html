<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoLang Playground</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><span>Mo</span>Lang Playground <small>Interactive Editor</small></div>

        <div class="top-actions">
            <span class="shortcut">Shift + R Run</span>
            <span class="shortcut">Shift + C Generated Code</span>
            <button id="clearButton" class="secondary">Clear</button>
            <button id="runButton" class="run">▶ Run</button>
        </div>
    </header>

    <main class="workspace">
        <section class="editor-panel">
            <div class="tabs">
                <button class="tab active" data-editor="page">PAGE</button>
                <button class="tab" data-editor="style">STYLE</button>
                <button class="tab" data-editor="script">SCRIPT</button>
            </div>

            <div class="editor-box">
                <div id="pageEditor" class="editor active"></div>
                <div id="styleEditor" class="editor"></div>
                <div id="scriptEditor" class="editor"></div>
            </div>

            <div class="editor-footer">
                <span id="languageLabel">MoLang PAGE</span>
                <span>Tab: indent • Shift+Tab: outdent • Brackets auto-close</span>
            </div>
        </section>

        <section class="right-panel">
            <section class="preview-panel">
                <div class="panel-title">
                    <span><i class="live-dot"></i> LIVE PREVIEW</span>
                    <button id="openPreview">Open</button>
                </div>
                <iframe id="preview" sandbox="allow-scripts"></iframe>
            </section>

            <section class="bottom-panel">
                <div class="result-tabs">
                    <button class="result-tab active" data-result="console">CONSOLE</button>
                    <button class="result-tab" data-result="generated">GENERATED CODE</button>
                    <button id="copyButton">Copy</button>
                </div>
                <pre id="consoleOutput" class="result active"></pre>
                <pre id="generatedOutput" class="result"></pre>
            </section>
        </section>
    </main>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script src="js/molang-language.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
